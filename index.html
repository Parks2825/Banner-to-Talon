<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV to Semicolon TXT Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    .container {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    input[type="file"] {
      display: block;
      width: 100%;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>CSV Merger & Column Mapper</h2>
  <p>Select CSV files to map columns into the semicolon-separated <code>.txt</code> output structure.</p>
  
  <div class="field">
    <label for="csvInputs">Select CSV Files:</label>
    <input type="file" id="csvInputs" accept=".csv" multiple>
  </div>

  <button id="convertBtn" onclick="processFiles()">Convert and Combine</button>
  <a id="downloadLink" style="display: none;"><button style="background-color: #28a745; margin-left: 10px;">Download TXT</button></a>

  <div id="status"></div>
</div>

<script>
  // Complete list of target headers (including mname)
  const TARGET_HEADERS = [
    "header", "customer_code", "api_code", "api_action", "loc_disname", 
    "pers_type", "pers_disname", "eta_id", "fname", "lname", "mname", 
    "uname", "chg_password", "chg_pin", "status", "pers_subtype_disname", 
    "acnt_type_disname", "reg_term_disname", "curr_lvl1_disname", "curr_status", 
    "first_sched_date", "team_disname", "cntrct_disname", "trng_cal_disr", 
    "class_disname", "user_type_dis", "local_email", "site_disname"
  ];

  // Column mapping definition: CSV Header (lowercase) -> Target Header Index
  const COLUMN_MAPPINGS = {
    "first name": "fname",
    "last name": "lname",
    "middle name": "mname",
    "a number": "uname"
  };

  async function processFiles() {
    const fileInput = document.getElementById('csvInputs');
    const statusDiv = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');

    if (!fileInput.files.length) {
      statusDiv.textContent = "Please select at least one CSV file.";
      return;
    }

    statusDiv.textContent = "Processing files...";
    downloadLink.style.display = "none";

    const files = Array.from(fileInput.files);
    let mappedDataRows = [];

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const text = await file.text();
      const lines = parseCSVLines(text);

      if (lines.length < 2) continue; // Skip empty files or files without data

      // Extract header row and clean column names
      const csvHeaders = lines[0].map(h => h.trim().toLowerCase());
      const dataRows = lines.slice(1);

      // Create index map for this specific file: targetHeader -> csvColumnIndex
      const indexMap = {};
      csvHeaders.forEach((colName, csvIdx) => {
        const targetHeaderKey = COLUMN_MAPPINGS[colName];
        if (targetHeaderKey) {
          indexMap[targetHeaderKey] = csvIdx;
        }
      });

      // Map each data row into the standard TARGET_HEADERS structure
      for (let row of dataRows) {
        let mappedRow = TARGET_HEADERS.map(header => {
          const csvColIndex = indexMap[header];
          return (csvColIndex !== undefined && row[csvColIndex] !== undefined) 
            ? row[csvColIndex] 
            : ""; // Output empty string if column is unmapped or missing
        });
        mappedDataRows.push(mappedRow);
      }
    }

    // Convert rows to semicolon-separated string
    const headerLine = TARGET_HEADERS.join(';');
    const formattedData = mappedDataRows
      .map(row => row.join(';'))
      .join('\n');

    const outputContent = headerLine + '\n' + formattedData;

    // Create Blob download link
    const blob = new Blob([outputContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    
    downloadLink.href = url;
    downloadLink.download = 'mapped_output.txt';
    downloadLink.style.display = 'inline-block';
    
    statusDiv.textContent = `Successfully processed ${files.length} file(s) and mapped columns! Click download to save.`;
  }

  // Robust CSV parser handling quoted strings and commas
  function parseCSVLines(text) {
    const lines = text.split(/\r\n|\n/);
    const result = [];

    for (let line of lines) {
      if (!line.trim()) continue;
      
      let fields = [];
      let insideQuotes = false;
      let currentField = '';

      for (let char of line) {
        if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
          fields.push(currentField.trim());
          currentField = '';
        } else {
          currentField += char;
        }
      }
      fields.push(currentField.trim());
      result.push(fields);
    }

    return result;
  }
</script>

</body>
</html>
